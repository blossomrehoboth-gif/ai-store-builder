<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — AI Store Builder</title>
<style>
  :root {
    --bg: #F3F5FA;
    --card: #FFFFFF;
    --ink: #0F1B33;
    --muted: #5B6880;
    --line: #E1E6F0;
    --navy: #0F1B33;
    --navy-2: #1A2A4D;
    --accent: #2F5BEA; --accent-dark: #2346BD;
    --ok: #0B7A55; --bad: #B42318;
    --green: #12805C;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; -webkit-text-size-adjust: 100%; }

  .main { padding: 24px 16px 56px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  a.back { display: inline-block; margin: 0 0 14px; padding: 11px 16px; min-height: 44px; font-size: 15px; font-weight: 700; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 12px; text-decoration: none; }
  a.back:active { background: var(--line); }
  .page-title { margin: 0 0 4px; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .who { color: var(--muted); margin-bottom: 20px; font-size: 15px; word-break: break-all; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(15,27,51,.04); }
  .card h2 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input { width: 100%; padding: 14px 13px; font: inherit; font-size: 16px; color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; background: #FAFBFE; }
  input:focus { border-color: var(--accent); background: #fff; }
  button, a.btn {
    display: block; width: 100%; margin-top: 12px; padding: 14px; min-height: 50px;
    font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: var(--accent);
    border: 0; border-radius: 12px; cursor: pointer; text-align: center; text-decoration: none;
  }
  button:active, a.btn:active { background: var(--accent-dark); }
  button.green, a.btn.green { background: var(--green); }
  button.plain { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  button:disabled { opacity: .6; }

  .ok { color: var(--ok); font-weight: 700; }
  .bad { color: var(--bad); }
  .msg { margin-top: 10px; min-height: 18px; font-size: 15px; }
  ul { margin: 0 0 14px; padding: 0; list-style: none; }
  li { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #FAFBFE; word-break: break-all; margin-bottom: 8px; }

  /* ---------- Tablet and desktop ---------- */
  @media (min-width: 640px) {
    .main { padding: 40px 28px 64px; }
    .page-title { font-size: 36px; }
    .card { padding: 24px; }
    button, a.btn { width: auto; min-width: 200px; padding-left: 28px; padding-right: 28px; }
  }
  @media (min-width: 960px) {
    .main { padding: 56px 28px 80px; }
    .wrap { max-width: 600px; }
    .page-title { font-size: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="main">
  <div class="wrap">
    <a class="back" href="/dashboard">&larr; Back to dashboard</a>
    <h1 class="page-title">Account</h1>
    <div class="who" id="who">Loading…</div>

    <div class="card" id="cjCard" hidden>
      <h2>Your CJ API key</h2>
      <p id="cjStatus">Orders from your stores are sent to <b>your own</b> CJ Dropshipping account, using this key.</p>
      <input id="cjKey" type="password" placeholder="Paste your CJ API key" autocomplete="off">
      <button id="saveKey">Save CJ key</button>
      <div class="msg" id="cjMsg"></div>
    </div>

    <div class="card">
      <h2>Your Shopify stores</h2>
      <p>Create a free Shopify store first, then connect it here. Only stores you connect can be published to.</p>
      <div id="shops"></div>
      <input id="shopDomain" type="text" placeholder="Your store name, e.g. ithon" autocapitalize="none" autocorrect="off">
      <button id="connect">Connect store</button>
      <div class="msg" id="shopMsg"></div>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function load() {
    const r = await fetch("/api/me");
    if (r.status === 401) { location.href = "/login?next=/account"; return; }
    const me = await r.json();
    $("who").textContent = me.email;
    // With a shared CJ account there is nothing for the seller to enter.
    $("cjCard").hidden = me.keyMode === "shared";
    $("cjStatus").innerHTML = me.hasCjKey
      ? '<span class="ok">CJ key saved.</span> Paste a new one below to replace it.'
      : 'Orders from your stores are sent to <b>your own</b> CJ Dropshipping account, using this key. <span class="bad">No key saved yet.</span>';
    $("shops").innerHTML = me.shops.length
      ? "<ul>" + me.shops.map((s) => `<li><b>${esc(s.name || s.shop)}</b>${s.name ? '<br><span style="color:#5B6880;font-size:13px">' + esc(s.shop) + '</span>' : ''}</li>`).join("") + "</ul>"
      : '<p class="bad">No stores connected yet.</p>';
    const c = new URLSearchParams(location.search).get("connected");
    if (c) { $("shopMsg").innerHTML = '<span class="ok">Connected ' + c.replace(/</g, "&lt;") + '.</span>'; }
  }

  $("saveKey").onclick = async () => {
    $("saveKey").disabled = true; $("cjMsg").textContent = "Checking with CJ…"; $("cjMsg").className = "msg";
    try {
      const r = await fetch("/api/account/cj-key", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey: $("cjKey").value }),
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Could not save.");
      $("cjKey").value = "";
      $("cjMsg").textContent = "Saved."; $("cjMsg").className = "msg ok";
      load();
    } catch (e) { $("cjMsg").textContent = e.message; $("cjMsg").className = "msg bad"; }
    finally { $("saveKey").disabled = false; }
  };

  // "ithon", "ithon.myshopify.com", or a pasted link all become ithon.myshopify.com
  function normalizeShop(input) {
    let v = String(input || "").trim().toLowerCase().replace(/^https?:\/\//, "");
    const admin = v.match(/^admin\.shopify\.com\/store\/([a-z0-9][a-z0-9-]*)/);
    if (admin) return admin[1] + ".myshopify.com";
    v = v.split(/[\/?#]/)[0];
    if (v && !v.includes(".")) v += ".myshopify.com";
    return v;
  }

  $("shopDomain").addEventListener("input", () => { $("shopMsg").textContent = ""; });

  $("connect").onclick = () => {
    const d = normalizeShop($("shopDomain").value);
    if (!/^[a-z0-9][a-z0-9-]*\.myshopify\.com$/.test(d)) {
      $("shopMsg").textContent = "Enter your store name, like ithon."; $("shopMsg").className = "msg bad"; return;
    }
    $("shopDomain").value = d;
    $("shopMsg").textContent = "Opening Shopify to connect " + d + "…"; $("shopMsg").className = "msg";
    location.href = "/auth?shop=" + encodeURIComponent(d);
  };


  load();
</script>
</body>
</html>
