<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — AI Store Builder</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f7f3ea; margin: 0; padding: 16px; color: #2b2b2b; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: #6b6355; margin: 0 0 20px; font-size: 0.9rem; }
  .order { background: #fff; border: 1px solid #e3dbc9; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .order.fulfilled { opacity: 0.55; }
  .order-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .order-num { font-weight: 700; }
  .order-date { font-size: 0.8rem; color: #8a8072; }
  .customer { font-size: 0.9rem; margin-bottom: 6px; }
  .address { font-size: 0.85rem; color: #57503f; background: #f7f3ea; padding: 8px; border-radius: 6px; margin-bottom: 10px; white-space: pre-line; }
  .item { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #efe8d8; }
  .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
  .item-name { font-size: 0.88rem; flex: 1; }
  .item a { display: inline-block; margin-top: 4px; font-size: 0.8rem; color: #8C6A30; font-weight: 600; text-decoration: none; }
  .no-ali { font-size: 0.8rem; color: #b23b3b; }
  button.fulfill-btn { margin-top: 10px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #8C6A30; color: #fff; font-weight: 600; }
  button.fulfill-btn:disabled { background: #cfc6b2; }
  button.retry-btn { margin-top: 8px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2A5DB0; color: #fff; font-weight: 600; }
  button.retry-btn:disabled { background: #b9c8e6; }
  .autoorder-result { font-size: 0.8rem; margin-top: 6px; padding: 8px; border-radius: 6px; white-space: pre-line; }
  .autoorder-result.ok { background: #e6f2e6; color: #1e5c1e; }
  .autoorder-result.fail { background: #fbe9e7; color: #a6392e; }
  .empty { text-align: center; color: #8a8072; margin-top: 60px; }
</style>
</head>
<body>
  <h1>Orders</h1>
  <p class="sub">Real orders from your Shopify store. Each one is sent to CJ Dropshipping automatically as soon as it comes in — no action needed unless one shows a failure below, in which case you can retry it or contact the customer.</p>

  <button id="check-prices-btn" style="width:100%;padding:12px;border:none;border-radius:8px;background:#2E7D32;color:#fff;font-weight:600;margin-bottom:20px;">
    Check AliExpress prices & stock
  </button>
  <p id="check-status" style="font-size:0.85rem;color:#57503f;margin:-14px 0 20px;"></p>

  <div id="list"></div>
  <div id="empty" class="empty" hidden>No orders yet.</div>

<script>
async function load() {
  const res = await fetch('/api/orders');
  const data = await res.json();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  if (!data.orders || data.orders.length === 0) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  data.orders.forEach((o) => {
    const div = document.createElement('div');
    div.className = 'order' + (o.fulfilled ? ' fulfilled' : '');
    const addr = o.address
      ? [o.address.address1, o.address.address2, o.address.city, o.address.province, o.address.zip, o.address.country].filter(Boolean).join('\\n')
      : 'No shipping address on this order';

    const itemsHtml = (o.lineItems || []).map((li) => `
      <div class="item">
        ${li.aliImage ? `<img src="${li.aliImage}" />` : '<div style="width:44px;height:44px;background:#eee;border-radius:6px"></div>'}
        <div class="item-name">
          ${li.quantity} × ${li.title}
          ${li.aliLink ? `<br/><a href="${li.aliLink}" target="_blank">View original AliExpress listing →</a>` : '<br/><span class="no-ali">No AliExpress link saved for this product</span>'}
        </div>
      </div>
    `).join('');

    // Show what happened with the automatic CJ order for this order.
    let resultHtml = '';
    let showRetry = false;
    if (o.autoOrderResults && o.autoOrderResults.length) {
      const allOk = o.autoOrderResults.every((r) => r.success);
      const lines = o.autoOrderResults
        .map((r) => `${r.title}: ${r.success ? (r.message || 'placed') : (r.message || r.reason)}`)
        .join('\\n');
      resultHtml = `<div class="autoorder-result ${allOk ? 'ok' : 'fail'}">${lines}</div>`;
      showRetry = !allOk;
    } else if (!o.fulfilled) {
      resultHtml = `<div class="autoorder-result">Sending to CJ...</div>`;
    }

    div.innerHTML = `
      <div class="order-top">
        <span class="order-num">Order ${o.orderNumber}</span>
        <span class="order-date">${new Date(o.receivedAt).toLocaleString()}</span>
      </div>
      <div class="customer">${o.customerName}</div>
      <div class="address">${addr}</div>
      ${itemsHtml}
      ${resultHtml}
      ${showRetry ? `<button class="retry-btn" data-id="${o.orderId}">Retry sending to CJ</button>` : ''}
      <button class="fulfill-btn" data-id="${o.orderId}" ${o.fulfilled ? 'disabled' : ''}>
        ${o.fulfilled ? 'Marked fulfilled' : 'Mark as fulfilled'}
      </button>
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('.fulfill-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Marking...';
      await fetch(`/api/orders/${btn.dataset.id}/fulfilled`, { method: 'POST' });
      load();
    });
  });

  list.querySelectorAll('.retry-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Retrying...';
      try {
        await fetch(`/api/orders/${btn.dataset.id}/auto-order`, { method: 'POST' });
      } catch (e) {
        // fall through — load() will still refresh and show current state
      }
      load();
    });
  });
}

load();
setInterval(load, 15000);

document.getElementById('check-prices-btn').addEventListener('click', async () => {
  const btn = document.getElementById('check-prices-btn');
  const status = document.getElementById('check-status');
  btn.disabled = true;
  btn.textContent = 'Checking... (uses AliExpress API calls)';
  status.textContent = '';
  try {
    const res = await fetch('/api/check-prices', { method: 'POST' });
    const data = await res.json();
    const changed = (data.results || []).filter((r) => r.changed);
    const outOfStock = (data.results || []).filter((r) => r.inStock === false);
    status.textContent = `Checked ${data.results?.length || 0} product(s). ${changed.length} price(s) updated. ${outOfStock.length} out of stock.`;
  } catch (e) {
    status.textContent = 'Something went wrong checking prices.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check AliExpress prices & stock';
  }
});
</script>
</body>
</html>
