<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — AI Store Builder</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f7f3ea; margin: 0; padding: 16px; color: #2b2b2b; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: #6b6355; margin: 0 0 20px; font-size: 0.9rem; }
  .order { background: #fff; border: 1px solid #e3dbc9; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .order.fulfilled { opacity: 0.55; }
  .order-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .order-num { font-weight: 700; }
  .order-date { font-size: 0.8rem; color: #8a8072; }
  .customer { font-size: 0.9rem; margin-bottom: 6px; }
  .address { font-size: 0.85rem; color: #57503f; background: #f7f3ea; padding: 8px; border-radius: 6px; margin-bottom: 10px; white-space: pre-line; }
  .item { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #efe8d8; }
  .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
  .item-name { font-size: 0.88rem; flex: 1; }
  .item a { display: inline-block; margin-top: 4px; font-size: 0.8rem; color: #8C6A30; font-weight: 600; text-decoration: none; }
  .no-ali { font-size: 0.8rem; color: #b23b3b; }
  button.fulfill-btn { margin-top: 10px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #8C6A30; color: #fff; font-weight: 600; }
  button.fulfill-btn:disabled { background: #cfc6b2; }
  .empty { text-align: center; color: #8a8072; margin-top: 60px; }
</style>
</head>
<body>
  <h1>Orders to fulfill</h1>
  <p class="sub">Real orders from your Shopify store. Tap the AliExpress link, paste the address, and check out — then mark it fulfilled.</p>
  <div id="list"></div>
  <div id="empty" class="empty" hidden>No orders yet.</div>

<script>
async function load() {
  const res = await fetch('/api/orders');
  const data = await res.json();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  if (!data.orders || data.orders.length === 0) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  data.orders.forEach((o) => {
    const div = document.createElement('div');
    div.className = 'order' + (o.fulfilled ? ' fulfilled' : '');
    const addr = o.address
      ? [o.address.address1, o.address.address2, o.address.city, o.address.province, o.address.zip, o.address.country].filter(Boolean).join('\\n')
      : 'No shipping address on this order';

    const itemsHtml = (o.lineItems || []).map((li) => `
      <div class="item">
        ${li.aliImage ? `<img src="${li.aliImage}" />` : '<div style="width:44px;height:44px;background:#eee;border-radius:6px"></div>'}
        <div class="item-name">
          ${li.quantity} × ${li.title}
          ${li.aliLink ? `<br/><a href="${li.aliLink}" target="_blank">Open on AliExpress →</a>` : '<br/><span class="no-ali">No AliExpress link saved for this product</span>'}
        </div>
      </div>
    `).join('');

    div.innerHTML = `
      <div class="order-top">
        <span class="order-num">Order ${o.orderNumber}</span>
        <span class="order-date">${new Date(o.receivedAt).toLocaleString()}</span>
      </div>
      <div class="customer">${o.customerName}</div>
      <div class="address">${addr}</div>
      ${itemsHtml}
      <button class="fulfill-btn" data-id="${o.orderId}" ${o.fulfilled ? 'disabled' : ''}>
        ${o.fulfilled ? 'Marked fulfilled' : 'Mark as fulfilled'}
      </button>
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('.fulfill-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Marking...';
      await fetch(`/api/orders/${btn.dataset.id}/fulfilled`, { method: 'POST' });
      load();
    });
  });
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
