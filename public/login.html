<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - AI Store Builder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1E1C1A;
    color: #F2EDE3;
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #26231F;
    border: 1px solid #3A362F;
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 24px; color: #AFA495; font-size: 15px; line-height: 1.5; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #FFFFFF;
    color: #1A1A1A;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
  }
  .error {
    display: none;
    margin-bottom: 16px;
    padding: 10px 12px;
    background: #3A1F1A;
    border: 1px solid #B85C3C;
    border-radius: 8px;
    color: #F2EDE3;
    font-size: 14px;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>AI Store Builder</h1>
    <p>Sign in to build and manage your store.</p>
    <div class="error" id="err"></div>
    <a class="btn" id="gbtn" href="/auth/google">Sign in with Google</a>
  </div>
<script>
  var params = new URLSearchParams(window.location.search);
  var error = params.get('error');
  if (error) {
    var box = document.getElementById('err');
    box.textContent = error;
    box.style.display = 'block';
  }
  var next = params.get('next');
  if (next) {
    document.getElementById('gbtn').href = '/auth/google?next=' + encodeURIComponent(next);
  }
</script>
</body>
</html>
