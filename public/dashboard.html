<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller dashboard</title>
<style>
  :root {
    --bg: #EFF6F4;
    --card: #FFFFFF;
    --ink: #10231F;
    --muted: #5A716B;
    --line: #DCE8E4;
    --bar: #0D3D38;
    --accent: #0F9D8A; --accent-dark: #0A7A6B; --lime: #B8F26B;
    --ok: #0B7A55; --ok-bg: #DDF4EA;
    --bad: #B42318; --bad-bg: #FDE8E7;
    --blue: #1F5FBF; --blue-bg: #E3EEFF;
    --warn: #6B4A00; --warn-bg: #FFF3D6; --warn-line: #EBD58F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; padding: 0 0 56px; -webkit-text-size-adjust: 100%; }

  /* top app bar */
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bar); color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0;
  }
  h1 { margin: 0; flex: 1; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .who { color: #A8CFC7; font-size: 12px; max-width: 42%; word-break: break-all; text-align: right; }
  .menu-btn { width: 46px; height: 46px; padding: 0; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; }
  .menu-btn:active { background: rgba(255,255,255,.25); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 0; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 12px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .stat.warn { border-top-color: var(--bad); background: var(--bad-bg); }
  .stat.warn .n { color: var(--bad); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: var(--accent); }
  .banner { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.45; }
  .banner a { color: var(--accent-dark); font-weight: 700; }

  .row { padding: 14px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .name { font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .muted a { color: var(--accent-dark); font-weight: 600; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
  .pill.fulfilled { background: var(--ok-bg); color: var(--ok); }
  .pill.sent { background: var(--blue-bg); color: var(--blue); }
  .pill.failed { background: var(--bad-bg); color: var(--bad); }
  .pill.processing { background: #EAF1EF; color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .items { font-size: 14px; margin-top: 6px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 6px; }

  button { padding: 11px 16px; font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; min-height: 44px; }
  button:active { background: var(--accent-dark); }
  button.full { width: 100%; padding: 14px; font-size: 16px; min-height: 52px; border-radius: 12px; }
  button.small { margin-top: 10px; }
  button:disabled { opacity: .6; }
  button:focus-visible, .banner a:focus-visible, nav a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

  .prod { display: flex; gap: 12px; align-items: center; }
  .prod img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: #E5EFEC; flex: none; }
  .empty { color: var(--muted); font-size: 14px; }
  .empty a { color: var(--accent-dark); font-weight: 600; }
  .msg { margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* slide-out menu */
  .overlay { position: fixed; inset: 0; background: rgba(8,28,25,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  nav#drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 84vw); z-index: 30;
    display: flex; flex-direction: column; gap: 6px; padding: 16px 14px; margin: 0;
    background: var(--bar); box-shadow: 8px 0 30px rgba(0,0,0,.35);
    transform: translateX(-105%); transition: transform .28s ease; overflow-y: auto;
  }
  nav#drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 14px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.15); font-size: 18px; color: #fff; }
  .close-btn { width: 44px; height: 44px; padding: 0; font-size: 30px; line-height: 1; background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; }
  nav#drawer a, nav#drawer a.alt { display: block; padding: 15px 16px; font-size: 16px; font-weight: 700; color: #D6EAE5; background: transparent; border: 0; border-radius: 12px; text-decoration: none; min-height: 52px; text-align: left; }
  nav#drawer a:first-of-type { background: var(--lime); color: #0D2A1F; }
  nav#drawer a:active { background: rgba(255,255,255,.18); color: #fff; }

  @media (min-width: 700px) {
    header { padding: 12px 28px; }
    h1 { font-size: 22px; }
    .wrap { max-width: 920px; padding: 28px 28px 0; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { padding: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1>Dashboard</h1>
  <span class="who" id="who"></span>
</header>
<div class="overlay" id="overlay"></div>
<nav id="drawer" aria-label="Main menu">
  <div class="drawer-head"><b>Menu</b><button class="close-btn" id="closeBtn" aria-label="Close menu">&times;</button></div>
  <a href="/">Build a store</a>
    <a href="/research.html" class="alt">Winners</a>
    <a href="/orders" class="alt">Orders</a>
    <a href="/account" class="alt">Account</a>
</nav>
<div class="wrap">

  <div id="setup"></div>

  <div class="grid" id="stats"></div>

  <div class="card">
    <h2>Recent orders</h2>
    <div id="orders"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Your stores</h2>
    <div id="shops"></div>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products"></div>
    <button class="full small" id="check">Check CJ prices &amp; stock</button>
    <div class="msg" id="checkMsg"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n, cur) => {
    if (n == null) return "—";
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD" }).format(n); }
    catch (e) { return (cur || "$") + " " + Number(n).toFixed(2); }
  };
  const when = (iso) => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const label = { fulfilled: "Fulfilled", sent: "Sent to CJ", failed: "Failed", processing: "Processing" };

  async function load() {
    const r = await fetch("/api/dashboard");
    if (r.status === 401) { location.href = "/login?next=/dashboard"; return; }
    const d = await r.json();
    if (d.error) { $("orders").innerHTML = '<div class="err">' + esc(d.error) + "</div>"; return; }

    $("who").textContent = d.email;

    // Setup checklist
    const todo = [];
    if (!d.hasCjKey) todo.push('Add your CJ API key');
    if (!d.shops.length) todo.push('Connect a Shopify store');
    $("setup").innerHTML = todo.length
      ? '<div class="banner"><b>Finish setup:</b> ' + todo.join(" · ") + '. <a href="/account">Go to Account</a></div>'
      : "";

    // Stats
    const cur = Object.keys(d.money)[0];
    const rev = cur ? d.money[cur] : null;
    const stats = [
      { n: d.counts.total, l: "Total orders" },
      { n: d.counts.week, l: "Orders this week" },
      { n: rev ? money(rev.total, cur) : "—", l: "Total sales" },
      { n: rev ? money(rev.week, cur) : "—", l: "Sales, last 7 days" },
      ...(d.keyMode === "shared" && d.cjBalance == null ? [] : [{ n: d.cjBalance != null ? money(d.cjBalance, "USD") : "—", l: "CJ balance" + (d.hasCjKey ? "" : " (add key)") }]),
      { n: d.counts.fulfilled, l: "Fulfilled" },
    ];
    let html = stats.map((s) => '<div class="stat"><div class="n">' + esc(s.n) + '</div><div class="l">' + esc(s.l) + "</div></div>").join("");
    if (d.counts.failed) html = '<div class="stat warn"><div class="n">' + d.counts.failed + '</div><div class="l">Orders need attention</div></div>' + html;
    if (d.outOfStock) html += '<div class="stat warn"><div class="n">' + d.outOfStock + '</div><div class="l">Products out of stock at CJ</div></div>';
    $("stats").innerHTML = html;

    // Orders
    $("orders").innerHTML = d.orders.length
      ? d.orders.map((o) =>
          '<div class="row"><div class="top"><div><span class="name">Order ' + esc(o.orderNumber) + '</span> <span class="muted">' + esc(when(o.receivedAt)) + '</span></div>' +
          '<span class="pill ' + o.status + '">' + label[o.status] + "</span></div>" +
          '<div class="muted">' + esc(o.customerName) + " · " + money(o.total, o.currency) + "</div>" +
          '<div class="items">' + o.items.map(esc).join("<br>") + "</div>" +
          (o.status === "failed" && o.message ? '<div class="err">' + esc(o.message) + "</div>" : "") +
          (o.status === "failed" ? '<button class="small" data-retry="' + esc(o.orderId) + '">Retry sending to CJ</button>' : "") +
          "</div>").join("")
      : '<div class="empty">No orders yet. They appear here the moment a customer buys.</div>';

    document.querySelectorAll("[data-retry]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true; b.textContent = "Sending…";
        try { await fetch("/api/orders/" + encodeURIComponent(b.dataset.retry) + "/auto-order", { method: "POST" }); } catch (e) {}
        load();
      };
    });

    // Stores
    $("shops").innerHTML = d.shops.length
      ? d.shops.map((s) =>
          '<div class="row"><div class="top"><span class="name">' + esc(s.name || s.shop) + "</span></div>" +
          (s.name ? '<div class="muted">' + esc(s.shop) + "</div>" : "") +
          '<div class="muted">' + s.products + " product" + (s.products === 1 ? "" : "s") + " · " + s.orders + " order" + (s.orders === 1 ? "" : "s") + " · " + money(s.revenue, cur) + " sales</div>" +
          '<div class="muted"><a href="https://' + esc(s.shop) + '/admin" target="_blank" rel="noopener">Open Shopify admin</a></div></div>').join("")
      : '<div class="empty">No stores connected. <a href="/account">Connect one</a>.</div>';

    // Products
    $("products").innerHTML = d.products.length
      ? d.products.map((p) =>
          '<div class="row prod">' + (p.image ? '<img src="' + esc(p.image) + '" alt="">' : '<img alt="">') +
          '<div style="flex:1"><div class="name">' + esc(p.title) + "</div>" +
          '<div class="muted">Sell ' + money(p.price) + " · Cost " + money(p.cost) +
          (p.profit != null ? " · Profit " + money(p.profit) + " before shipping" : "") + "</div></div>" +
          (p.inStock === false ? '<span class="pill failed">Out of stock</span>' : p.inStock === true ? '<span class="pill ok">In stock</span>' : "") +
          "</div>").join("")
      : '<div class="empty">No products linked to CJ yet. Build a store and publish it.</div>';
  }

  $("check").onclick = async () => {
    $("check").disabled = true;
    $("checkMsg").textContent = "Checking with CJ… this takes about 2 seconds per product.";
    try {
      const r = await fetch("/api/check-prices", { method: "POST" });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Check failed.");
      const changed = (d.results || []).filter((x) => x.changed).length;
      const bad = (d.results || []).filter((x) => !x.ok).length;
      $("checkMsg").textContent = "Done. " + changed + " price" + (changed === 1 ? "" : "s") + " updated" + (bad ? ", " + bad + " could not be checked" : "") + ".";
      load();
    } catch (e) {
      $("checkMsg").textContent = e.message;
    } finally {
      $("check").disabled = false;
    }
  };

  // Slide-out menu
  (function () {
    const btn = $("menuBtn"), drawer = $("drawer"), overlay = $("overlay");
    function setOpen(open) {
      drawer.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) $("closeBtn").focus(); else btn.focus();
    }
    btn.onclick = () => setOpen(true);
    $("closeBtn").onclick = () => setOpen(false);
    overlay.onclick = () => setOpen(false);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer.classList.contains("open")) setOpen(false); });
  })();

  load();
</script>
</body>
</html>
